[project]
name = "skyportal"
version = "2.1.0"
description = "A CircuitPython based flight tracker."
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "sco1", email = "sco1.git@gmail.com"}
]

readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: Other OS",
    "Programming Language :: Python :: Implementation :: MicroPython",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]

requires-python = ">=3.14"
dependencies = []

[project.urls]
Homepage = "https://github.com/sco1/"
Documentation = "https://github.com/sco1/skyportal/blob/main/README.md"
Repository = "https://github.com/sco1/skyportal.git"
Issues = "https://github.com/sco1/skyportal/issues"
Changelog = "https://github.com/sco1/skyportal/blob/main/CHANGELOG.md"

[project.scripts]
map_gen = "utils.build_map_tile:main"

[dependency-groups]
dev = [
    "black~=26.5",
    "flake8~=7.1",
    "flake8-annotations~=3.1",
    "flake8-define-class-attributes~=0.2",
    "niquests~=3.21",
    "isort~=9.0",
    "mypy~=2.2",
    "pre-commit~=4.0",
    "python-dotenv~=1.0",
    "ruff~=0.6",
    "sco1-bumper~=2.0",
]

[tool.black]
line-length = 100

[tool.isort]
case_sensitive = true
known_first_party = "skyportal,tests"
no_lines_before = "LOCALFOLDER"
order_by_type = false
profile = "black"
line_length = 100
extend_skip = "lib"

[tool.pyright]
reportShadowedImports = false

[tool.mypy]
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
enable_error_code = "exhaustive-match"
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
exclude = ["lib", "adsblol-proxy"]

[tool.uv.build-backend]
module-name = "skyportal"
module-root = ""

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"
